# Case Law Schema
# Extended metadata schema for case-law records.
# A case-law record MUST NOT be treated as authoritative unless all required
# fields are populated and verified.

schema_version: "1.0.0"

fields:
  source_id:
    type: string
    required: true
    description: "Unique kebab-case identifier (e.g., 'novartis-v-union-of-india-2013')."

  case_name:
    type: string
    required: true
    description: "Full styled case name (e.g., 'Novartis AG v. Union of India & Others')."

  court:
    type: string
    required: true
    description: >
      Full name of the court or tribunal that decided the case.
      Examples: "Supreme Court of India", "Delhi High Court",
      "Intellectual Property Appellate Board", "European Patent Office (Technical Board of Appeal)".

  jurisdiction:
    type: string
    required: true
    enum:
      - india
      - international

  docket_citation:
    type: string
    required: true
    description: >
      Official citation or docket number.
      Examples: "Civil Appeal Nos. 2706–2716 of 2013", "EP0436257",
      "(2013) 6 SCC 1".

  decision_date:
    type: date
    required: true
    format: "YYYY-MM-DD"
    description: "Date the judgment or decision was rendered."

  judges:
    type: list
    required: false
    description: "Names of the presiding judges or panel members."

  parties:
    type: object
    required: false
    properties:
      petitioner:
        type: string
      respondent:
        type: string

  subject_matter:
    type: list
    required: false
    description: "Legal topics covered (e.g., ['Section 3(d)', 'pharmaceutical patents', 'traditional knowledge'])."

  held:
    type: string
    required: false
    description: "Brief summary of the court's holding/decision."

  official_source_url:
    type: string
    required: true
    format: uri
    description: >
      URL to the official judgment text on a court or tribunal website
      (e.g., sci.gov.in, indiankanoon.org for Indian courts,
      epo.org for EPO decisions).

  source_document:
    type: string
    required: false
    description: "Filename of the judgment document if available."

  verification_status:
    type: string
    required: true
    enum:
      - verified
      - pending-review
      - incomplete
      - rejected

  ayush_relevance:
    type: string
    required: false
    description: "Brief note on why this case is relevant to AYUSH IP protection."

  notes:
    type: string
    required: false

validation_rules:
  - rule: "case_law_completeness"
    description: >
      A case-law record MUST have court, docket_citation, decision_date,
      and official_source_url populated before it can be marked 'verified'.
    check: >
      record.court is not null
      and record.docket_citation is not null
      and record.decision_date is not null
      and record.official_source_url is not null

  - rule: "no_narrative_only"
    description: >
      Narrative-only records (text summaries without structured court/citation metadata)
      MUST be placed in quarantine/incomplete-case-law/ until fields are populated.
