# Source Metadata Schema
# Defines the required and optional fields for every source package in the knowledge base.
# All source.yaml files MUST conform to this schema.

schema_version: "1.0.0"

fields:
  source_id:
    type: string
    required: true
    description: >
      Unique kebab-case identifier for the source (e.g., "patents-act-1970").
      Must be globally unique across both jurisdictions.
    pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"

  title:
    type: string
    required: true
    description: "Full official title of the source document."

  short_title:
    type: string
    required: false
    description: "Abbreviated title for display in citations and UI."

  source_type:
    type: string
    required: true
    description: "Classification of the source."
    enum:
      - statute
      - rule
      - treaty
      - pharmacopoeial-standard
      - registry-record
      - case-law
      - guidance
      - secondary-material

  jurisdiction:
    type: string
    required: true
    description: "Legal jurisdiction the source belongs to."
    enum:
      - india
      - international

  issuing_authority:
    type: string
    required: true
    description: >
      Official body that issued or enacted the source.
      Examples: "Parliament of India", "WIPO", "Ministry of AYUSH",
      "National Biodiversity Authority", "Central Council for Research in Ayurvedic Sciences".

  country:
    type: string
    required: false
    description: "ISO 3166-1 alpha-2 country code (e.g., 'IN', 'CH'). Leave blank for multilateral treaties."

  language:
    type: string
    required: true
    default: "en"
    description: "ISO 639-1 language code of the source document."

  publication_date:
    type: date
    required: false
    format: "YYYY-MM-DD"
    description: "Date the source was officially published or enacted."

  effective_date:
    type: date
    required: false
    format: "YYYY-MM-DD"
    description: "Date the source came into legal effect (may differ from publication)."

  version_label:
    type: string
    required: false
    description: >
      Label for the current version (e.g., "1970-original", "2005-amendment").
      Referenced by current.yaml.

  official_url:
    type: string
    required: true
    format: uri
    description: >
      Official government or treaty body URL where the authoritative text can be found.
      Must point to the issuing authority's website, not a secondary source.

  access_date:
    type: date
    required: true
    format: "YYYY-MM-DD"
    description: "Date the document was downloaded or accessed from the official URL."

  checksum_sha256:
    type: string
    required: true
    pattern: "^[a-f0-9]{64}$"
    description: "SHA-256 hash of the original document file."

  status:
    type: string
    required: true
    enum:
      - current
      - amended
      - superseded
      - repealed
      - draft
    description: "Legislative status of this source."

  supersedes:
    type: string
    required: false
    description: "source_id of the source this one replaces, if applicable."

  superseded_by:
    type: string
    required: false
    description: "source_id of the source that replaces this one, if applicable."

  verification_status:
    type: string
    required: true
    enum:
      - verified
      - pending-review
      - incomplete
      - rejected
    description: >
      Current verification state. A source MUST NOT be marked 'verified' without
      a corresponding verification record in the provenance directory.

  verified_by:
    type: string
    required: false
    description: "Name or identifier of the person who verified this source."

  verification_date:
    type: date
    required: false
    format: "YYYY-MM-DD"
    description: "Date the verification was completed."

  citation_format:
    type: string
    required: false
    description: >
      Preferred citation format for this source.
      Example: "The Patents Act, 1970 (Act No. 39 of 1970), § {section}"

  notes:
    type: string
    required: false
    description: "Free-text notes about this source, its provenance, or known issues."

validation_rules:
  - rule: "jurisdiction_required"
    description: "Every source MUST have a jurisdiction field."
    check: "source.jurisdiction is not null"

  - rule: "official_url_for_authoritative"
    description: "Sources with source_type in [statute, rule, treaty, pharmacopoeial-standard, case-law] MUST have an official_url."
    check: "if source.source_type in ['statute','rule','treaty','pharmacopoeial-standard','case-law'] then source.official_url is not null"

  - rule: "verified_requires_record"
    description: "A source marked 'verified' MUST have verified_by and verification_date set."
    check: "if source.verification_status == 'verified' then source.verified_by is not null and source.verification_date is not null"

  - rule: "no_embeddings_in_sources"
    description: "Vector databases, embedding files, or generated model artifacts MUST NOT exist inside any sources/ directory."
    check: "no files matching *.bin, *.pkl, *.sqlite3, *.parquet in sources/"
