# Version Record Schema
# Defines the structure for individual version records within a source package.
# Each version directory MUST contain a metadata.yaml conforming to this schema.

schema_version: "1.0.0"

fields:
  source_id:
    type: string
    required: true
    description: "The source_id this version belongs to."

  version_label:
    type: string
    required: true
    description: >
      Human-readable label for this version.
      Convention: "{year}-{descriptor}" (e.g., "1970-original", "2005-amendment-1").

  version_type:
    type: string
    required: true
    enum:
      - original
      - amendment
      - revision
      - consolidation
      - corrigendum
    description: "Type of version change."

  publication_date:
    type: date
    required: false
    format: "YYYY-MM-DD"

  effective_date:
    type: date
    required: false
    format: "YYYY-MM-DD"

  gazette_reference:
    type: string
    required: false
    description: "Official gazette notification number and date, if applicable."

  amendment_act:
    type: string
    required: false
    description: "Name and number of the amending act or notification, if this is an amendment."

  changes_summary:
    type: string
    required: false
    description: "Brief description of what changed in this version compared to the previous."

  original_filename:
    type: string
    required: true
    description: "Filename of the original document in the original/ subdirectory."

  checksum_sha256:
    type: string
    required: true
    pattern: "^[a-f0-9]{64}$"
    description: "SHA-256 hash of the original document file for this version."

  page_count:
    type: integer
    required: false
    description: "Total page count of the original document."

  ocr_required:
    type: boolean
    required: false
    default: false
    description: "Whether the document required OCR for text extraction."

  extraction_method:
    type: string
    required: false
    enum:
      - pymupdf-text
      - ocr-tesseract
      - ocr-google-vision
      - manual-transcription
      - not-extracted
    description: "Method used to extract text from the original document."

  extracted_filename:
    type: string
    required: false
    description: "Filename of the extracted text in the extracted/ subdirectory."

  notes:
    type: string
    required: false

# How to add a new version:
# 1. Create a new directory under versions/ with the version_label as name.
# 2. Place the original document in versions/{version_label}/original/.
# 3. Create metadata.yaml in versions/{version_label}/ conforming to this schema.
# 4. Compute and write the SHA-256 checksum to versions/{version_label}/checksum.sha256.
# 5. Update the parent source's current.yaml to point to this version if it is the latest.
# 6. If this version supersedes a previous version, update the previous version's notes.
