# Render Blueprint Specification for IP-SAKTI Sahayak Backend
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    # Keep the Blueprint service name aligned with the existing Render service.
    # This prevents a Blueprint sync from describing a second, differently named API.
    name: ragvyn
    runtime: python
    rootDir: backend
    plan: free # Note: Free tier allocates 512 MB RAM. Local BGE-M3 & CrossEncoder preloading must be disabled to prevent OOM.
    region: frankfurt # Low latency connection to Supabase / Qdrant Cloud (AWS eu-central-1)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    # Liveness must not depend on external Qdrant/Supabase availability.
    # Validate dependencies separately through /readiness after deployment.
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: HF_TOKEN
        sync: false # Set in Render Dashboard: Hugging Face User Access Token
      - key: HF_EMBEDDING_MODEL
        value: BAAI/bge-m3
      - key: HF_INFERENCE_PROVIDER
        value: auto
      - key: HF_EMBEDDING_TIMEOUT
        value: "60"
      - key: HF_EMBEDDING_NORMALIZE
        value: "true"
      - key: LOCAL_BGE_FALLBACK
        value: "false"
      - key: ENABLE_LOCAL_BGE_PRELOAD
        value: "false"
      - key: ENABLE_CROSS_ENCODER
        value: "true"
      - key: RETRIEVAL_BACKEND
        value: qdrant_hybrid
      - key: QDRANT_URL
        sync: false # Set in Render Dashboard: e.g. https://[cluster-id].eu-central-1.aws.cloud.qdrant.io:6333
      - key: QDRANT_API_KEY
        sync: false # Set in Render Dashboard
      - key: QDRANT_PRODUCTION_COLLECTION
        value: ragvyn_prod_v2
      - key: QDRANT_COLLECTION
        value: ragvyn_prod_v2
      - key: QDRANT_FALLBACK_ENABLED
        value: "true"
      - key: QDRANT_REQUEST_TIMEOUT_SECONDS
        value: "15"
      - key: QDRANT_RRF_MIN_SCORE
        value: "0.01"
      - key: QDRANT_CANARY_ENABLED
        value: "false"
      - key: QDRANT_TRAFFIC_PERCENT
        value: "0"
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard: postgresql+psycopg://postgres.[ref]:[pwd]@aws-0-[region].pooler.supabase.com:6543/postgres
      - key: SUPABASE_URL
        sync: false # Set in Render Dashboard: https://[ref].supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Set in Render Dashboard
      - key: SUPABASE_STORAGE_BUCKET
        value: legal-documents
      - key: GOOGLE_REDIRECT_URI
        value: https://ragvyn.onrender.com/api/auth/google/callback
      - key: FRONTEND_URL
        sync: false # Set in Render Dashboard: e.g. https://ip-sakti-sahayak.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false # Set in Render Dashboard: e.g. ["https://ip-sakti-sahayak.vercel.app"]
      - key: JWT_SECRET_KEY
        generateValue: true

