<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - IP-SAKTI Sahayak</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .logo {
      font-size: 4rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #F59E0B;
    }
    .hindi {
      font-size: 1rem;
      color: #94A3B8;
      margin-bottom: 1.5rem;
    }
    p {
      color: #94A3B8;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background: #1D4ED8;
      color: #fff;
      padding: 12px 32px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #1E40AF;
      transform: translateY(-2px);
    }
    .features {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid #334155;
    }
    .features h3 {
      font-size: 0.9rem;
      color: #10B981;
      margin-bottom: 1rem;
    }
    .feature-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .feature-tag {
      background: rgba(16, 185, 129, 0.1);
      color: #10B981;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🌿</div>
    <h1>You're Offline</h1>
    <p class="hindi">आप ऑफ़लाइन हैं</p>
    <p>
      IP-SAKTI Sahayak needs an internet connection to provide AI-powered IP guidance. 
      Please check your connection and try again.
    </p>
    <a href="/" class="btn" onclick="location.reload(); return false;">
      Try Again
    </a>
    
    <div class="features">
      <h3>While you wait, remember IP-SAKTI helps with:</h3>
      <div class="feature-list">
        <span class="feature-tag">Patents Act 1970</span>
        <span class="feature-tag">TKDL Search</span>
        <span class="feature-tag">ABS Compliance</span>
        <span class="feature-tag">GI Tags</span>
        <span class="feature-tag">Biodiversity Act</span>
      </div>
    </div>
  </div>
</body>
</html>
