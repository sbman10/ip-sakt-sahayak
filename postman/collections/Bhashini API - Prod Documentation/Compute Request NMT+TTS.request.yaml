$kind: http-request
url: "{{callback_url}}"
method: POST
headers:
  Accept: " */*"
  User-Agent: " Thunder Client (https://www.thunderclient.com)"
  "{{compute_call_authorization_key}}": "{{compute_call_authorization_value}}"
body:
  type: json
  content: |-
    {
        "pipelineTasks": [
            {
                "taskType": "translation",
                "config": {
                    "language": {
                        "sourceLanguage": "{{source_language}}",
                        "targetLanguage": "{{target_language}}"
                    },
                    "serviceId": "{{nmt_service_id}}"
                }
            },
            {
                "taskType": "tts",
                "config": {
                    "language": {
                        "sourceLanguage": "{{target_language}}"
                    },
                    "serviceId": "{{tts_service_id}}",
                    "gender": "female",
                    "samplingRate": 8000
                }
            }
        ],
        "inputData": {
            "input": [
                {
                    "source": "मेरा नाम विहिर है और मैं भाषाावर्ष यूज कर रहा हूँ"
                }
            ]
        }
    }
settings: {}
order: 10000
