$kind: http-request
url: "{{ulca_base_url}}{{model_pipeline_endpoint}}"
method: POST
headers:
  - key: ulcaApiKey
    value: "{{api_key}}"
  - key: userID
    value: "{{user_id}}"
  - key: Authorization
    value: ""
    disabled: true
body:
  type: json
  content: |-
    {
        "pipelineTasks" : [
            {
                "taskType" : "asr"
            },
            {
                "taskType": "translation"
            },
            {  
                "taskType": "tts"
            } 
        ],
        "pipelineRequestConfig" : {
            "pipelineId": "{{pipeline_id}}"
        }
    }
scripts:
  - type: afterResponse
    code: "var jsonRes=pm.response.json();\r

      pm.collectionVariables.set(\"callback_url\", jsonRes.pipelineInferenceAPIEndPoint.callbackUrl);\r

      pm.collectionVariables.set(\"callback_url_feedback\", jsonRes.feedbackUrl);\r

      pm.collectionVariables.set(\"compute_call_authorization_key\", jsonRes.pipelineInferenceAPIEndPoint.inferenceApiKey.name);\r

      pm.collectionVariables.set(\"compute_call_authorization_value\", jsonRes.pipelineInferenceAPIEndPoint.inferenceApiKey.value);\r

      \r

      var pipelineResponseConfig=jsonRes.pipelineResponseConfig;\r

      for(let eachResp of pipelineResponseConfig){\r

      \    if(eachResp.taskType=='asr'){\r

      \        var allConfig=eachResp.config;\r

      \        for(let eachConfig of allConfig){\r

      \            if(eachConfig.language.sourceLanguage==pm.collectionVariables.get('source_language')){\r

      \                pm.collectionVariables.set(\"asr_service_id\", eachConfig.serviceId);\r

      \            }\r

      \        }\r

      \    }\r

      \    else if(eachResp.taskType=='translation'){\r

      \        var allConfig=eachResp.config;\r

      \        for(let eachConfig of allConfig){\r

      \            if(eachConfig.language.sourceLanguage==pm.collectionVariables.get('source_language') && eachConfig.language.targetLanguage==pm.collectionVariables.get('target_language')){\r

      \                pm.collectionVariables.set(\"nmt_service_id\", eachConfig.serviceId);\r

      \            }\r

      \        }\r

      \    }\r

      \    else if(eachResp.taskType=='tts'){\r

      \        var allConfig=eachResp.config;\r

      \        for(let eachConfig of allConfig){\r

      \            if(eachConfig.language.sourceLanguage==pm.collectionVariables.get('target_language')){\r

      \                pm.collectionVariables.set(\"tts_service_id\", eachConfig.serviceId);\r

      \            }\r

      \        }\r

      \    }\r

      \    \r

      }"
    language: text/javascript
settings: {}
order: 2000
