$kind: http-request
url: "{{callback_url}}"
method: POST
headers:
  Accept: " */*"
  User-Agent: " Thunder Client (https://www.thunderclient.com)"
  "{{compute_call_authorization_key}}": "{{compute_call_authorization_value}}"
body:
  type: json
  content: |-
    {
        "pipelineTasks": [
            {
                "taskType": "asr",
                "config": {
                    "language": {
                        "sourceLanguage": "{{source_language}}"
                    },
                    "serviceId": "{{asr_service_id}}",
                    "audioFormat": "flac",
                    "samplingRate": 16000
                }
            }
        ],
        "inputData": {
            "audio": [
                {
                    "audioContent": "{{base64}}"
                }
            ]
        }
    }
scripts:
  - type: afterResponse
    code: "\r

      pm.collectionVariables.set(\"inference_input_payload\", JSON.stringify(JSON.parse(pm.request.body)));\r

      pm.collectionVariables.set(\"inference_output_payload\", JSON.stringify(pm.response.json()));\r

      console.log(pm.collectionVariables.get('inference_inout_payload'))\r

      console.log(pm.collectionVariables.get('inference_output_payload'))"
    language: text/javascript
settings: {}
order: 5000
